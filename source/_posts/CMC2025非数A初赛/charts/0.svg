<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>

  <text x="90" y="28" font-size="16" fill="#111">空间区域 Ω 的投影示意</text>
  <text x="410" y="28" font-size="16" fill="#111">固定 z 的截面 D_z</text>

  <!-- 左图坐标轴 -->
  <line x1="80" y1="300" x2="220" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="300" x2="145" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80" y1="300" x2="80" y2="120" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="224" y="305" font-size="14">x</text>
  <text x="150" y="242" font-size="14">y</text>
  <text x="72" y="116" font-size="14">z</text>

  <!-- 左图区域面 -->
  <polygon points="80,200 130,160 230,160" fill="#cce5ff" opacity="0.65" stroke="#1f5fa8"/>
  <polygon points="80,250 105,230 155,230" fill="#ffd9b3" opacity="0.65" stroke="#b35c00"/>
  <polygon points="80,250 105,230 130,160 80,200" fill="#b3e6b3" opacity="0.35" stroke="#2e7d32"/>
  <polygon points="80,250 155,230 230,160 80,200" fill="#f4b3c2" opacity="0.25" stroke="#a61b3a"/>
  <polygon points="105,230 155,230 230,160 130,160" fill="#ffffb3" opacity="0.35" stroke="#8a8a00"/>

  <!-- 左图棱 -->
  <polyline points="80,250 105,230 155,230 80,250" fill="none" stroke="#b35c00"/>
  <polyline points="80,200 130,160 230,160 80,200" fill="none" stroke="#1f5fa8"/>
  <line x1="80" y1="250" x2="80" y2="200" stroke="#333"/>
  <line x1="105" y1="230" x2="130" y2="160" stroke="#333"/>
  <line x1="155" y1="230" x2="230" y2="160" stroke="#333"/>

  <text x="62" y="255" font-size="12">A_1</text>
  <text x="96" y="226" font-size="12">B_1</text>
  <text x="158" y="226" font-size="12">C_1</text>
  <text x="62" y="202" font-size="12">A_2</text>
  <text x="120" y="156" font-size="12">B_2</text>
  <text x="234" y="164" font-size="12">C_2</text>

  <text x="84" y="245" font-size="12" fill="#555">z=1</text>
  <text x="84" y="195" font-size="12" fill="#555">z=2</text>
  <text x="190" y="150" font-size="12" fill="#555">y=z</text>
  <text x="130" y="250" font-size="12" fill="#555">x=0</text>
  <text x="170" y="205" font-size="12" fill="#a61b3a">x=y</text>

  <!-- 右图坐标轴 -->
  <line x1="400" y1="300" x2="550" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="300" x2="400" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="554" y="305" font-size="14">x</text>
  <text x="392" y="136" font-size="14">y</text>

  <!-- 右图截面 D_z -->
  <polygon points="400,300 400,190 500,190" fill="#cce5ff" opacity="0.7" stroke="#1f5fa8"/>
  <line x1="400" y1="300" x2="500" y2="190" stroke="#a61b3a" stroke-width="1.5"/>

  <text x="378" y="245" font-size="12" fill="#555">x=0</text>
  <text x="440" y="184" font-size="12" fill="#555">y=z</text>
  <text x="452" y="238" font-size="12" fill="#a61b3a">x=y</text>
  <text x="410" y="270" font-size="13" fill="#111">D_z: 0≤x≤y≤z</text>

  <circle cx="400" cy="300" r="2.5" fill="#111"/>
  <circle cx="400" cy="190" r="2.5" fill="#111"/>
  <circle cx="500" cy="190" r="2.5" fill="#111"/>
  <text x="386" y="316" font-size="12">O</text>
  <text x="380" y="188" font-size="12">(0,z)</text>
  <text x="502" y="188" font-size="12">(z,z)</text>
</svg>