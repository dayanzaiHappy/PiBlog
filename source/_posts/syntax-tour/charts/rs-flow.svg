      <stop offset="0" stop-color="#1b5e9c"/>
      <stop offset="1" stop-color="#17a2a2"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="160" fill="#ffffff"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="24" y="50" width="150" height="60" rx="8" fill="#f2f7fc" stroke="#d8e3ee"/>
    <text x="99" y="77" text-anchor="middle" font-size="15" fill="#0d2b45">选题</text>
